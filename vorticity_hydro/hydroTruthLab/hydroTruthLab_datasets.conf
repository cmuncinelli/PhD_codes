###############################################################################
# hydroTruthLab_datasets.conf
#
# The hydro datasets that runHydroTruthLab.sh can run on, one per line:
#
#   label  centrality  bullet  noBullet  jetFile
#
#   label       name of the dataset in hydroTruthLab_runs.conf and in the run labels (<label>_<variation>): letters, digits, '.', '+', '-'
#   centrality  label of the PerConfig plots (--centralityLabel), no spaces
#   bullet      sample folder with the jet (one subfolder per event, <event>/results/<iSS file>)
#   noBullet    sample folder with the same initial conditions and no jet, or "none" (no Difference/ then)
#   jetFile     phi_J of every event: rows of "event n_random phi px py", or "event phi px py". Both samples take their triggers from it
#
# Paths are relative to HYDRO_BASE (runHydroTruthLab.sh) unless absolute. The pairings below were checked with surveyHydroDatasets.sh -p:
# same initial condition, event by event, for every event the two samples share. Datasets not listed have no jet direction (*_sorted_x,
# x_ins only), a single event (smooth_events) or no hydro output (iSS_samplings, smooth_bg_*).
###############################################################################

# --- Paired: bullet and no_bullet from the same initial conditions ---------------------------------------------------------------------------
# 40-50%: the reference dataset of the PRC paper. no_bullet has 300 folders, the iSS output stops at 249
lumpy4050       40-50%  lumpy_events_40_50/bullet               lumpy_events_40_50/no_bullet  lumpy_events_40_50/random_parameters.dat
# 60-70%
lumpy6070       60-70%  lumpy_events_60_70/bullet               lumpy_events_60_70/no_bullet  lumpy_events_60_70/random_parameters.dat
# 60-70%, other jet depositions (total_current_energy, |p|) in GeV: E30 (30, 43), P20E30 (30, 20), P20E60 (59.6, 20). iSS output in 0-99
# (E30) and in 41 or 31 events of 0-48 (P20E30, P20E60), the rest skipped
lumpy6070E30    60-70%  lumpy_events_60_70/bullet_E30           lumpy_events_60_70/no_bullet  lumpy_events_60_70/bullet_E30/random_parameters.dat
lumpy6070P20E30 60-70%  lumpy_events_60_70/bullet_P20_E30       lumpy_events_60_70/no_bullet  lumpy_events_60_70/bullet_P20_E30/random_parameters.dat
lumpy6070P20E60 60-70%  lumpy_events_60_70/bullet_P20_E60       lumpy_events_60_70/no_bullet  lumpy_events_60_70/bullet_P20_E60/random_parameters.dat
# 40-50%, jet injected away from the origin, on the initial conditions of lumpy_events_40_50: R+2 places the bullet 2 fm along the jet
# direction, R-2 2 fm against it (bullet_position = R p/|p|, as the ranges of the survey show). R+4 has its own jet file (300 rows), the
# others share the one of the dataset
pos4050Rp2      40-50%  position_lumpy_events_40_50/R+2         lumpy_events_40_50/no_bullet  position_lumpy_events_40_50/random_parameters.dat
pos4050Rm2      40-50%  position_lumpy_events_40_50/R-2         lumpy_events_40_50/no_bullet  position_lumpy_events_40_50/random_parameters.dat
pos4050Rp4      40-50%  position_lumpy_events_40_50/R+4         lumpy_events_40_50/no_bullet  position_lumpy_events_40_50/R+4/random_parameters.dat
pos4050Rm4      40-50%  position_lumpy_events_40_50/R-4         lumpy_events_40_50/no_bullet  position_lumpy_events_40_50/random_parameters.dat
# 40-50%, jet at a fixed position (bullet_position_x = 2 fm, y = 0) and 180 directions. The sample is the dataset folder itself, and its jet
# file has rows of 4 fields under a 5-column header
breakSym4050    40-50%  break_symmetry                          lumpy_events_40_50/no_bullet  break_symmetry/random_parameters.dat

# --- Bullet only: no no_bullet sample of these initial conditions ----------------------------------------------------------------------------
# 0-5%, 180 jet directions on a regular grid in [0, 2pi) (rows of 4 fields). No iSS output in event 113
lumpy0005fine   0-5%    lumpy_events_0_5_fine                   none                          lumpy_events_0_5_fine/phi_parameters.dat
# 0-5%, jet injected away from the origin, as for pos4050*, on the initial conditions of lumpy_events_0_5_fine
pos0005Rp2      0-5%    position_lumpy_events_0_5/R+2           none                          position_lumpy_events_0_5/random_parameters.dat
pos0005Rm2      0-5%    position_lumpy_events_0_5/R-2           none                          position_lumpy_events_0_5/random_parameters.dat
pos0005Rp4      0-5%    position_lumpy_events_0_5/R+4           none                          position_lumpy_events_0_5/random_parameters.dat
pos0005Rm4      0-5%    position_lumpy_events_0_5/R-4           none                          position_lumpy_events_0_5/random_parameters.dat

# --- Not in use ------------------------------------------------------------------------------------------------------------------------------
# 40-50%, "rotated" initial conditions (meaning unknown, ask Vitor), iSS output in 0-99 of both samples. Paired by the survey
#lumpy4050rot   40-50%  lumpy_events_40_50_rotated/bullet       lumpy_events_40_50_rotated/no_bullet  lumpy_events_40_50_rotated/bullet/random_parameters.dat
