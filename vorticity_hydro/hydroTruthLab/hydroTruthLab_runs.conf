###############################################################################
# hydroTruthLab_runs.conf
#
# The runs of runHydroTruthLab.sh, one per line:
#
#   run  <dataset>  <variation>  [option=value ...]
#
#   dataset     a label of hydroTruthLab_datasets.conf
#   variation   name of this configuration: letters, digits, '.', '+', '-'. The run is <dataset>_<variation>, and so are its folder and files
#   option      any option of PRODUCER_OPTS or PERCONFIG_OPTS in runHydroTruthLab.sh, by name and without "--", which replaces its default
#               there. An option missing from those blocks is added there first, with its default, so that no run depends on a default
#               hidden in a macro. trigger=rp also turns mixing off, as event mixing makes no sense with a fixed phi=0 direction
#   seed        Can have a range of different values. See below:
#               none: a seed of its own, drawn from the clock
#               seed=<integer>: that seed (up to 4294967295)
#               seed=<name>: one clock-drawn seed shared by every run of this invocation with that name. The smudge draws are then the
#               same, each rescaled by its smudgeSigma: smudged results differ only through the width, not through the draws (common
#               random numbers). Rerunning part of a group (--only) gives that part a new seed, and the script says so
#
# And the comparisons that hydroTruthLabSummaryPlots.cxx draws across runs, one folder each, after every run:
#
#   compare  <name>  <x>  <run>  <run>  [<run> ...]   (up to eight runs)
#
#   x           what labels the runs, one bin each in the order listed: an option of either macro (its value in each run),
#               centralityLabel, initialConditions, or runLabel (the part of the run labels that differs)
#   The first run is the reference of DifferenceToFirst/ only because it comes first: each other run minus it, jackknifed jointly over the
#   events the two share when their datasets have the same initial conditions
###############################################################################

# --- Defaults: one run per dataset -----------------------------------------------------------------------------------------------------------
run lumpy4050       default
run lumpy6070       default
run lumpy6070E30    default
run lumpy6070P20E30 default
run lumpy6070P20E60 default
run pos4050Rp2      default
run pos4050Rm2      default
run pos4050Rp4      default
run pos4050Rm4      default
run breakSym4050    default
run lumpy0005fine   default
run pos0005Rp2      default
run pos0005Rm2      default
run pos0005Rp4      default
run pos0005Rm4      default

# --- Trigger along the impact parameter (no mixing) ------------------------------------------------------------------------------------------
run lumpy4050       rp              trigger=rp
run lumpy6070       rp              trigger=rp

# --- Smudging, 40-50% ------------------------------------------------------------------------------------------------------------------------
# Width scan with common random numbers. smudge0.02 repeats the default width with the shared seed
run lumpy4050       smudge0.01      smudgeSigma=0.01 seed=smudgeScan4050
run lumpy4050       smudge0.02      smudgeSigma=0.02 seed=smudgeScan4050
run lumpy4050       smudge0.05      smudgeSigma=0.05 seed=smudgeScan4050
run lumpy4050       smudge0.1       smudgeSigma=0.1  seed=smudgeScan4050
run lumpy4050       smudge0.2       smudgeSigma=0.2  seed=smudgeScan4050
run lumpy4050       smudge0.4       smudgeSigma=0.4  seed=smudgeScan4050
# Azimuth-only smudging at the same width as smudge0.1. The two modes draw different sequences, so the seed is not shared
run lumpy4050       smudgePhi0.1    smudgeSigma=0.1  smudgeMode=phi
# Draws per event, with common random numbers: the 10 draws of draws10 are the first 10 of draws50
run lumpy4050       draws1          smudgeSigma=0.1  smudgeDraws=1  seed=drawScan4050
run lumpy4050       draws10         smudgeSigma=0.1  smudgeDraws=10 seed=drawScan4050
run lumpy4050       draws50         smudgeSigma=0.1  smudgeDraws=50 seed=drawScan4050
# Seed-to-seed spread of the smudged curves (each run its own clock seed), to set against their jackknife errors
run lumpy4050       seedA           smudgeSigma=0.1
run lumpy4050       seedB           smudgeSigma=0.1
run lumpy4050       seedC           smudgeSigma=0.1

# --- Comparisons for hydroTruthLabSummaryPlots.cxx ------------------------------------------------------------------------------------------
compare centrality      centralityLabel lumpy0005fine_default lumpy4050_default lumpy6070_default
compare trigger4050     runLabel        lumpy4050_default lumpy4050_rp
compare trigger6070     runLabel        lumpy6070_default lumpy6070_rp
compare smudgeSigma4050 smudgeSigma     lumpy4050_smudge0.01 lumpy4050_smudge0.02 lumpy4050_smudge0.05 lumpy4050_smudge0.1 lumpy4050_smudge0.2 lumpy4050_smudge0.4
compare smudgeMode4050  runLabel        lumpy4050_smudge0.1 lumpy4050_smudgePhi0.1
compare smudgeDraws4050 smudgeDraws     lumpy4050_draws1 lumpy4050_draws10 lumpy4050_draws50
compare seedSpread4050  runLabel        lumpy4050_seedA lumpy4050_seedB lumpy4050_seedC
compare deposition6070  runLabel        lumpy6070_default lumpy6070E30_default lumpy6070P20E30_default lumpy6070P20E60_default
# Injection position R = -4, -2, 0, 2, 4 fm. At 0-5%, lumpy0005fine stands for R = 0: same initial conditions, but its own jet directions (a
# regular grid) and 180 events
compare position4050    runLabel        pos4050Rm4_default pos4050Rm2_default lumpy4050_default pos4050Rp2_default pos4050Rp4_default
compare position0005    runLabel        pos0005Rm4_default pos0005Rm2_default lumpy0005fine_default pos0005Rp2_default pos0005Rp4_default

# --- Not in use ------------------------------------------------------------------------------------------------------------------------------
#run lumpy4050rot   default
