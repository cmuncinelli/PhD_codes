# Example O2 configuration for the InjectedPolO2MC generator. ${INJPOL_ROOT} is set by the run/ scripts from their
# hard-coded REPO_DIR (absolute path, no trailing "/"); you normally never use this file directly.
# run/runInjectedPol.sh writes an equivalent ini in the work directory, pointing to the chosen model config.
[GeneratorExternal]
fileName = ${INJPOL_ROOT}/generator/generator_pythia8_injectedPol.C
funcName = generator_injectedPol("${INJPOL_ROOT}/generator/configs/none.cfg")

[GeneratorPythia8]
config = ${INJPOL_ROOT}/generator/pythia8_pp_13600.cfg
