### Pythia8 card for InjectedPolO2MC (pp @ 13.6 TeV, minimum bias).
### Mirrors what O2DPG's MC/config/common/pythia8/utils/mkpy8cfg.py writes for "-gen pythia8 -col pp -eCM 13600"
### (process "inel", default Monash tune), so that the zero-polarization baseline is comparable to a standard production.
### NO "Random:" lines on purpose: O2 then seeds Pythia from o2-sim --seed (set per timeframe by O2DPG), which
### also makes the afterburner reproducible (it draws from Pythia's own random-number generator).

### beams
Beams:idA = 2212
Beams:idB = 2212
Beams:eCM = 13600.

### processes
SoftQCD:inelastic = on

### decays (ALICE standard: particles with c*tau > 1 cm are left to Geant4)
ParticleDecays:limitTau0 = on
ParticleDecays:tau0Max = 10.

### Lambdas are decayed by the InjectedPol afterburner, never by Pythia (also enforced in the generator's Init())
3122:mayDecay = off
