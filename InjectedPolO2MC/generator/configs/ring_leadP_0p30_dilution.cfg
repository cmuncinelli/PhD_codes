# Ring polarization P* = 0.30 n_hat around the generator-level leading particle (trigger t_hat), WITHOUT requiring a
# generator trigger: events with no leading particle above 2 GeV/c are simulated too, and their Lambdas get P* = 0.
# This reproduces the "dilution" present in data (reconstructed triggers in events without a genuine hard scattering).
# Cost: more Geant4-transported events per signal event. See DESIGN.md, section 7b.
model.ring = 0.30
model.trigger = leadP
presel.requireLeadP = 0
