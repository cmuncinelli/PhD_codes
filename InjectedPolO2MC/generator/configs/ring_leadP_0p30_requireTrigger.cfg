# Ring polarization P* = 0.30 n_hat around the generator-level leading particle, simulating ONLY events that have a
# generator trigger (leading particle pT > 2 GeV/c). Cleanest closure (every Lambda has a defined n_hat) but less
# dilution than data, and about 2.5x fewer Geant4-transported events per triggered event. See DESIGN.md, section 7b.
model.ring = 0.30
model.trigger = leadP
presel.requireLeadP = 1
