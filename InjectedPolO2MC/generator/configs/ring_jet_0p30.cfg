# Ring polarization P* = 0.30 n_hat, n_hat = (t_hat x p_Lambda)/|...|, with the trigger t_hat = generator-level leading
# anti-kT R=0.4 charged jet (pT > 8 GeV/c by
# default, |eta_jet| < 0.5). The pre-selection requires such a jet: some Pythia events are rejected per accepted
# event (cheap compared with Geant4; check the acceptance printed by the generator summary or by
# tests/standalonePythiaClosure). The final jet threshold is applied later, in the analysis (FastJet on tracks).
model.ring = 0.30
model.trigger = jet
presel.requireLeadP = 1
presel.requireJet = 1
