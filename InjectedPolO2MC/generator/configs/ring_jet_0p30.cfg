# Ring polarization P* = 0.30 t_hat around the generator-level leading anti-kT R=0.4 jet (pT > 20 GeV/c,
# |eta_jet| < 0.5). The pre-selection requires such a jet: many Pythia events are rejected per accepted event
# (cheap compared with Geant4, but check the acceptance printed in the generator summary). A pTHat-biased
# Pythia card is the alternative if this becomes too slow (then event weights must be used).
model.ring = 0.30
model.ringProxy = jet
presel.requireLeadP = 1
presel.requireJet = 1
