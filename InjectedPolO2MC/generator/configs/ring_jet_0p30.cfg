# Ring polarization P* = 0.30 n_hat, n_hat = (t_hat x p_Lambda)/|...|, with the trigger t_hat = generator-level leading
# anti-kT R=0.4 charged jet (pT > 8 GeV/c by default, |eta_jet| < 0.5). The final jet threshold is applied later, in the
# analysis (FastJet on tracks). By default events without such a jet are simulated too, with P* = 0 (data-like dilution);
# in minimum-bias pp most events have no 8 GeV/c jet, so set presel.requireJet = 1 to simulate only events with a jet
# (much cheaper in Geant4 per injected-signal event). See DESIGN.md, section 7b.
model.ring = 0.30
model.trigger = jet
presel.requireLeadP = 0
presel.requireJet = 0
