# DEFAULT ring configuration.
# Ring polarization P* = 0.30 n_hat, n_hat = (t_hat x p_Lambda)/|...|, with the trigger t_hat = generator-level
# LEADING PARTICLE (pT > 2 GeV/c). Events WITHOUT such a trigger are simulated too and their Lambdas get P* = 0:
# this reproduces the "dilution" present in data (reconstructed triggers in events without a genuine hard scattering).
# Pre-selection: >= 1 (anti)Lambda with |y| < 1 only. See DESIGN.md, section 7b.
model.ring = 0.30
model.trigger = leadP
presel.requireLeadP = 0
