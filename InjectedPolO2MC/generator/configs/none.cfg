# Zero-polarization baseline: Lambdas decayed isotropically by the afterburner (same bookkeeping as the
# polarized runs). Compare with a standard production (Geant4 decays) to measure the method systematic
# (DESIGN.md, validation step 3). All keys are listed with their default values for reference.

# --- polarization models (amplitudes; all zero = no polarization) ---
model.ring = 0.
model.ringProxy = jet          # jet | leadP
model.global = 0.
model.longitudinal = 0.
model.longHarmonic = 2
model.helicity = 0.
model.antiSign = 1.            # P*(AntiLambda) = antiSign * P*(Lambda model)

# --- decay ---
decay.ctauMM = -1              # <= 0: Pythia tau0 for the Lambda (78.9 mm, same as Geant4)
decay.brPPi = 0.641            # PDG 2025; renormalised together with decay.brNPi0
decay.brNPi0 = 0.359
decay.polarizeNPi0 = 1         # use alpha_0 = 0.670 / alpha_0bar = -0.675 for the n pi0 channel

# --- generator-level jet proxies (mirror the LambdaPolRing-v4 producer defaults) ---
axes.trackPtMin = 0.15
axes.trackEtaMax = 0.9
axes.pionMassHypothesis = 1
axes.leadPtMin = 2.0
axes.jetR = 0.4
axes.jetPtMin = 20.

# --- generator-level pre-selection (before Geant4; biases the sample, apply identically everywhere) ---
presel.minLambdas = 1
presel.lambdaRapMax = 1.0
presel.lambdaPtMin = 0.
presel.requireLeadP = 1
presel.requireJet = 0
presel.maxTries = 100000000

# --- reaction plane (global / longitudinal models) ---
rp.random = 1

verbose = 0
